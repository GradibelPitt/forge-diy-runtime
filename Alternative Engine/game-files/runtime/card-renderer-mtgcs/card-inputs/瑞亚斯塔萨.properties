oracle=飞行\n作为施放此咒语的额外费用，你可以请援龙。（你可以选择一个由你操控的龙，或从你手上展示一张龙牌。）\n当你施放瑞亚斯塔萨时，如果你的起始套牌中每张非地牌的名称均不相同且你施放此咒语时请援了龙，则你获得名为纯净龙巢的徽记，其具有「在你的战斗前行动阶段开始时，加三点任意颜色组合的法术力。此法术力只能用于施放龙咒语。发现一张龙牌。以此法发现的牌永久获得虹彩异能（你可以用任意颜色的法术力支付此咒语的法术力费用）。」
