name: Adventure exclusion regression
on:
  push:
    paths:
      - 'app/res/adventure/**'
      - 'app/res/skins/default/sprite_adventure.png'
      - 'app/overlays/**'
      - 'release.json'
      - 'tools/build_release.ps1'
      - 'tools/publish_git_payload.ps1'
      - 'tests/test_adventure_exclusion.ps1'
      - '.github/workflows/test-adventure-exclusion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Fetch pinned updater and packaging fixtures
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA"
          foreach ($path in @('release.json', 'tools/build_release.ps1', 'tools/publish_git_payload.ps1', 'tests/test_adventure_exclusion.ps1', 'app/overlays/001-forge-diy-updater-resources.jar')) {
            $destination = Join-Path $env:GITHUB_WORKSPACE $path
            New-Item -ItemType Directory -Path (Split-Path $destination) -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing "$base/$path" -OutFile $destination
          }
          $tree = Invoke-RestMethod -Headers @{ Authorization = 'Bearer ${{ github.token }}' } "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/trees/$env:GITHUB_SHA`?recursive=1"
          if ($tree.truncated) { throw 'Runtime inventory truncated.' }
          foreach ($entry in $tree.tree) {
            if ($entry.path -match '^app/res/adventure(/|$)' -or $entry.path -eq 'app/res/skins/default/sprite_adventure.png') { throw "Adventure remains tracked: $($entry.path)" }
          }
      - name: Verify embedded updater and native Windows resource copy
        shell: powershell
        run: |
          & ./tests/test_adventure_exclusion.ps1
          if ($LASTEXITCODE -gt 7) { throw 'Adventure regression failed.' }
