name: Adventure exclusion regression
on:
  push:
    paths:
      - 'app/res/adventure/**'
      - 'app/res/skins/default/sprite_adventure.png'
      - 'app/overlays/**'
      - 'tools/run_diy_updater_macos.sh'
      - 'tools/select_diy_update*.ps1'
      - 'starter/**'
      - 'tests/test_macos_update_selection.ps1'
      - 'release.json'
      - 'tools/build_release.ps1'
      - 'tools/publish_git_payload.ps1'
      - 'tests/test_adventure_exclusion.ps1'
      - '.github/workflows/test-adventure-exclusion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platforms:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: powershell
          - os: macos-latest
            shell: pwsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Fetch pinned updater and packaging fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA"
          foreach ($path in @('release.json', 'tools/build_release.ps1', 'tools/publish_git_payload.ps1', 'tests/test_adventure_exclusion.ps1', 'tools/select_diy_update.ps1', 'tools/select_diy_update_macos.ps1', 'tools/run_diy_updater_macos.sh', 'tests/test_diy_update.ps1', 'tests/test_macos_update_selection.ps1')) {
            $destination = Join-Path $env:GITHUB_WORKSPACE $path
            New-Item -ItemType Directory -Path (Split-Path $destination) -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing "$base/$path" -OutFile $destination
          }
          $release = Get-Content ./release.json -Raw | ConvertFrom-Json
          $source = "https://raw.githubusercontent.com/GradibelPitt/forge/$($release.sourceCommit)/forge-gui/src/main/resources/forge/download/diy-updater.ps1"
          Invoke-WebRequest -UseBasicParsing $source -OutFile source-updater.ps1
          if ((Get-FileHash source-updater.ps1 -Algorithm SHA256).Hash -ne $release.updaterResourceSha256) { throw 'Embedded updater does not match the pinned source policy.' }
          $tree = Invoke-RestMethod -Headers @{ Authorization = 'Bearer ${{ github.token }}' } "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/trees/$env:GITHUB_SHA`?recursive=1"
          if ($tree.truncated) { throw 'Runtime inventory truncated.' }
          $carriers = @($release.moduleOverlays | ForEach-Object { "app/overlays/$_" })
          if ($release.moduleOverlays -notcontains '001-forge-diy-updater-resources.jar') {
            $carriers += @($tree.tree | Where-Object { $_.path -match '^app/[^/]+-jar-with-dependencies\.jar$' } | Select-Object -ExpandProperty path)
          }
          foreach ($path in $carriers) {
            $destination = Join-Path $env:GITHUB_WORKSPACE $path
            New-Item -ItemType Directory -Path (Split-Path $destination) -Force | Out-Null
            Invoke-WebRequest -UseBasicParsing "$base/$path" -OutFile $destination
          }
          foreach ($entry in $tree.tree) {
            if ($entry.path -match '^app/res/adventure(/|$)' -or $entry.path -eq 'app/res/skins/default/sprite_adventure.png') { throw "Adventure remains tracked: $($entry.path)" }
          }
      - name: Verify embedded updater and version selection on both platforms
        shell: pwsh
        run: |
          & ./tests/test_adventure_exclusion.ps1
          & ./tests/test_diy_update.ps1
          if ($env:RUNNER_OS -eq 'macOS') { & ./tests/test_macos_update_selection.ps1 }
          if ($LASTEXITCODE -gt 7) { throw 'Adventure regression failed.' }
          # Robocopy returns 1 when files were copied successfully.
          $global:LASTEXITCODE = 0
      - name: Windows PowerShell 5.1 runtime compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/test_adventure_exclusion.ps1
          & ./tests/test_diy_update.ps1
          $global:LASTEXITCODE = 0
