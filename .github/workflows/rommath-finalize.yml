name: Finalize Grand Magister Rommath runtime

on:
  push:
    branches: [main]
    paths:
      - 'rommath-final-trigger.txt'

permissions:
  contents: write

concurrency:
  group: finalize-grand-magister-rommath
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout pinned authoritative source
        uses: actions/checkout@v4
        with:
          repository: GradibelPitt/forge
          ref: 92617ff472755b5025a18337d0940763f83f1ee5
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate authoritative Rommath source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reportRoot = Join-Path $env:GITHUB_WORKSPACE 'rommath-final-report'
          New-Item -ItemType Directory -Path $reportRoot -Force | Out-Null

          $sourceSha = (& git -C '.\source' rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceSha -ne '92617ff472755b5025a18337d0940763f83f1ee5') {
            throw "Unexpected authoritative source commit: $sourceSha"
          }
          "SOURCE_COMMIT=$sourceSha" | Set-Content -LiteralPath (Join-Path $reportRoot 'verification.txt') -Encoding utf8
          "ROMMATH_SOURCE_SHA=$sourceSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          python -m pip install --disable-pip-version-check pillow *> (Join-Path $reportRoot 'pip.log')
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install Pillow.' }

          Push-Location '.\source\custom'
          try {
            python .\tools\lint_card.py '.\cards\blue\大法师罗曼斯.txt' *> (Join-Path $reportRoot 'source-lint.log')
            $lintExit = $LASTEXITCODE
            Get-Content -LiteralPath (Join-Path $reportRoot 'source-lint.log') -Encoding UTF8 | ForEach-Object { Write-Host $_ }
            if ($lintExit -ne 0) { throw 'Rommath lint failed.' }

            python -m unittest tests.test_grand_magister_rommath -v *> (Join-Path $reportRoot 'source-test.log')
            $testExit = $LASTEXITCODE
            Get-Content -LiteralPath (Join-Path $reportRoot 'source-test.log') -Encoding UTF8 | ForEach-Object { Write-Host $_ }
            if ($testExit -ne 0) { throw 'Rommath targeted tests failed.' }
          } finally {
            Pop-Location
          }

          $cardsIndex = Get-Content -LiteralPath '.\source\custom\CARDS.md' -Raw -Encoding UTF8
          if ($cardsIndex -notmatch [regex]::Escape('cards/blue/大法师罗曼斯.txt')) {
            throw 'Rommath is missing from source custom/CARDS.md.'
          }
          if (-not (Test-Path -LiteralPath '.\source\custom\tests\test_grand_magister_rommath.py' -PathType Leaf)) {
            throw 'Rommath targeted test is missing from source.'
          }

      - name: Generate Rommath-only runtime payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE 'source'
          $sourceSha = $env:ROMMATH_SOURCE_SHA
          $reportPath = Join-Path $env:GITHUB_WORKSPACE 'rommath-final-report\verification.txt'

          $sourceCard = Join-Path $sourceRoot 'custom\cards\blue\大法师罗曼斯.txt'
          $sourceEdition = Join-Path $sourceRoot 'custom\editions\Placeholder_Set.txt'
          $sourceLocalization = Join-Path $sourceRoot 'forge-gui\res\languages\cardnames-zh-CN.txt'
          $sourceArt = Join-Path $sourceRoot 'custom\cards\pictures\PH01\大法师罗曼斯.artcrop.jpg'

          $runtimeCard = Join-Path $env:GITHUB_WORKSPACE 'app\managed\custom\cards\blue\大法师罗曼斯.txt'
          $runtimeEdition = Join-Path $env:GITHUB_WORKSPACE 'app\managed\custom\editions\Placeholder_Set.txt'
          $runtimeLocalization = Join-Path $env:GITHUB_WORKSPACE 'app\res\languages\cardnames-zh-CN.txt'
          $runtimeArt = Join-Path $env:GITHUB_WORKSPACE 'app\managed\custom\cards\pictures\PH01\大法师罗曼斯.artcrop.jpg'
          $runtimeTokenHs = Join-Path $env:GITHUB_WORKSPACE 'app\managed\custom\editions\Token_HS.txt'

          foreach ($path in @($sourceCard, $sourceEdition, $sourceLocalization, $sourceArt, $runtimeLocalization, $runtimeTokenHs)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing required file: $path" }
          }

          $sourceRows = @(Get-Content -LiteralPath $sourceLocalization -Encoding UTF8 | Where-Object { $_.StartsWith('大法师罗曼斯|') })
          if ($sourceRows.Count -ne 1 -or $sourceRows[0].Split('|', 4).Count -ne 4) {
            throw 'Source must contain exactly one four-field Rommath localization row.'
          }
          $rommathRow = $sourceRows[0]

          function Get-UnrelatedLocalizationHash([string]$Path) {
            $lines = @(Get-Content -LiteralPath $Path -Encoding UTF8 | Where-Object { -not $_.StartsWith('大法师罗曼斯|') })
            $bytes = [Text.Encoding]::UTF8.GetBytes(($lines -join "`n"))
            $sha = [Security.Cryptography.SHA256]::Create()
            try { return ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '') }
            finally { $sha.Dispose() }
          }

          $unrelatedLocalizationBefore = Get-UnrelatedLocalizationHash $runtimeLocalization
          $tokenHsBefore = (Get-FileHash -LiteralPath $runtimeTokenHs -Algorithm SHA256).Hash

          Copy-Item -LiteralPath $sourceCard -Destination $runtimeCard -Force
          Copy-Item -LiteralPath $sourceEdition -Destination $runtimeEdition -Force
          Copy-Item -LiteralPath $sourceArt -Destination $runtimeArt -Force

          $runtimeBytes = [IO.File]::ReadAllBytes($runtimeLocalization)
          $hasBom = $runtimeBytes.Length -ge 3 -and $runtimeBytes[0] -eq 0xEF -and $runtimeBytes[1] -eq 0xBB -and $runtimeBytes[2] -eq 0xBF
          $runtimeText = [IO.File]::ReadAllText($runtimeLocalization, [Text.Encoding]::UTF8)
          $lineEnding = if ($runtimeText.Contains("`r`n")) { "`r`n" } else { "`n" }
          $trimmed = $runtimeText.TrimEnd("`r", "`n")
          $lines = if ($trimmed.Length -eq 0) { @() } else { @([regex]::Split($trimmed, '\r?\n')) }
          $lines = @($lines | Where-Object { -not $_.StartsWith('大法师罗曼斯|') })
          $lines += $rommathRow
          [IO.File]::WriteAllText(
            $runtimeLocalization,
            (($lines -join $lineEnding) + $lineEnding),
            [Text.UTF8Encoding]::new($hasBom)
          )

          $unrelatedLocalizationAfter = Get-UnrelatedLocalizationHash $runtimeLocalization
          if ($unrelatedLocalizationBefore -ne $unrelatedLocalizationAfter) {
            throw 'An unrelated localization row changed during the Rommath-only patch.'
          }

          foreach ($protectedName in @('小型卡扎库斯药水', '卡扎库斯药水', '伪造的药水')) {
            $sourceProtected = @(Get-Content -LiteralPath $sourceLocalization -Encoding UTF8 | Where-Object { $_.StartsWith("$protectedName|") })
            $runtimeProtected = @(Get-Content -LiteralPath $runtimeLocalization -Encoding UTF8 | Where-Object { $_.StartsWith("$protectedName|") })
            if (($sourceProtected -join "`n") -ne ($runtimeProtected -join "`n")) {
              throw "Protected potion localization boundary changed: $protectedName"
            }
          }

          $buildId = '20260905-grand-magister-rommath-' + $sourceSha.Substring(0, 8)
          & .\tools\publish_git_payload.ps1 -ForgeRoot $sourceRoot -BuildId $buildId *> (Join-Path $env:GITHUB_WORKSPACE 'rommath-final-report\publisher.log')
          $publishExit = $LASTEXITCODE
          Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'rommath-final-report\publisher.log') -Encoding UTF8 | ForEach-Object { Write-Host $_ }
          if ($publishExit -ne 0) { throw 'Runtime publisher failed.' }

          $tokenHsAfter = (Get-FileHash -LiteralPath $runtimeTokenHs -Algorithm SHA256).Hash
          if ($tokenHsBefore -ne $tokenHsAfter) { throw 'Token_HS.txt changed across Rommath publication.' }

          "BUILD_ID=$buildId" | Add-Content -LiteralPath $reportPath -Encoding utf8
          "TOKEN_HS_SHA256_UNCHANGED=$tokenHsAfter" | Add-Content -LiteralPath $reportPath -Encoding utf8
          "ROMMATH_BUILD_ID=$buildId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify payload hashes and metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE 'source'
          $reportPath = Join-Path $env:GITHUB_WORKSPACE 'rommath-final-report\verification.txt'

          $pairs = [ordered]@{
            CARD = @(
              (Join-Path $sourceRoot 'custom\cards\blue\大法师罗曼斯.txt'),
              (Join-Path $env:GITHUB_WORKSPACE 'app\managed\custom\cards\blue\大法师罗曼斯.txt')
            )
            EDITION = @(
              (Join-Path $sourceRoot 'custom\editions\Placeholder_Set.txt'),
              (Join-Path $env:GITHUB_WORKSPACE 'app\managed\custom\editions\Placeholder_Set.txt')
            )
            ART = @(
              (Join-Path $sourceRoot 'custom\cards\pictures\PH01\大法师罗曼斯.artcrop.jpg'),
              (Join-Path $env:GITHUB_WORKSPACE 'app\managed\custom\cards\pictures\PH01\大法师罗曼斯.artcrop.jpg')
            )
          }
          foreach ($key in $pairs.Keys) {
            $sourceHash = (Get-FileHash -LiteralPath $pairs[$key][0] -Algorithm SHA256).Hash
            $runtimeHash = (Get-FileHash -LiteralPath $pairs[$key][1] -Algorithm SHA256).Hash
            if ($sourceHash -ne $runtimeHash) { throw "Source/runtime mismatch: $key" }
            "SHA256_$key=$sourceHash" | Add-Content -LiteralPath $reportPath -Encoding utf8
            Write-Host "SHA256_$key=$sourceHash"
          }

          $editionText = Get-Content -LiteralPath $pairs.EDITION[1] -Raw -Encoding UTF8
          if (@([regex]::Matches($editionText, '(?m)^139\s+M\s+大法师罗曼斯\s+@Custom\s*$')).Count -ne 1) {
            throw 'PH01 must have exactly one #139 Rommath row.'
          }

          $sourceLocalization = Join-Path $sourceRoot 'forge-gui\res\languages\cardnames-zh-CN.txt'
          $runtimeLocalization = Join-Path $env:GITHUB_WORKSPACE 'app\res\languages\cardnames-zh-CN.txt'
          $sourceRows = @(Get-Content -LiteralPath $sourceLocalization -Encoding UTF8 | Where-Object { $_.StartsWith('大法师罗曼斯|') })
          $runtimeRows = @(Get-Content -LiteralPath $runtimeLocalization -Encoding UTF8 | Where-Object { $_.StartsWith('大法师罗曼斯|') })
          if ($sourceRows.Count -ne 1 -or $runtimeRows.Count -ne 1 -or $sourceRows[0] -ne $runtimeRows[0]) {
            throw 'Rommath localization row is not identical between source and runtime.'
          }
          $sha = [Security.Cryptography.SHA256]::Create()
          try {
            $rowHash = ([BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($runtimeRows[0])))).Replace('-', '')
          } finally { $sha.Dispose() }
          "SHA256_LOCALIZATION_ROW=$rowHash" | Add-Content -LiteralPath $reportPath -Encoding utf8
          "SHA256_LOCALIZATION_RUNTIME_FILE=$((Get-FileHash -LiteralPath $runtimeLocalization -Algorithm SHA256).Hash)" | Add-Content -LiteralPath $reportPath -Encoding utf8

          $release = Get-Content -LiteralPath '.\release.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $buildId = (Get-Content -LiteralPath '.\app\BUILD-ID.txt' -Raw -Encoding UTF8).Trim()
          if ($release.sourceCommit -ne $env:ROMMATH_SOURCE_SHA) { throw 'release.json sourceCommit is stale.' }
          if ($release.buildId -ne $buildId -or $buildId -ne $env:ROMMATH_BUILD_ID) { throw 'BUILD-ID metadata mismatch.' }

          $manifestPath = '.\app\manifest-critical.sha256'
          $manifestLines = @(Get-Content -LiteralPath $manifestPath -Encoding UTF8)
          if ($manifestLines.Count -eq 0) { throw 'Critical manifest is empty.' }
          $expected = [ordered]@{
            'BUILD-ID.txt' = '.\app\BUILD-ID.txt'
            'managed/custom/cards/blue/大法师罗曼斯.txt' = $pairs.CARD[1]
            'managed/custom/editions/Placeholder_Set.txt' = $pairs.EDITION[1]
            'managed/custom/cards/pictures/PH01/大法师罗曼斯.artcrop.jpg' = $pairs.ART[1]
            'res/languages/cardnames-zh-CN.txt' = $runtimeLocalization
          }
          foreach ($relative in $expected.Keys) {
            $hash = (Get-FileHash -LiteralPath $expected[$relative] -Algorithm SHA256).Hash
            $pattern = '^' + [regex]::Escape($hash) + ' \*' + [regex]::Escape($relative) + '$'
            if (-not ($manifestLines -match $pattern)) { throw "Manifest entry is missing or stale: $relative" }
          }
          "MANIFEST_ENTRIES=$($manifestLines.Count)" | Add-Content -LiteralPath $reportPath -Encoding utf8
          "SHA256_MANIFEST=$((Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash)" | Add-Content -LiteralPath $reportPath -Encoding utf8

      - name: Stage scoped payload
        id: stage_payload
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:GITHUB_WORKSPACE 'rommath-final-report\stage.log'
          "=== git add ===" | Set-Content -LiteralPath $log -Encoding utf8
          & git add -- `
            app/BUILD-ID.txt `
            app/managed/custom/cards/blue/大法师罗曼斯.txt `
            app/managed/custom/editions/Placeholder_Set.txt `
            app/managed/custom/cards/pictures/PH01/大法师罗曼斯.artcrop.jpg `
            app/res/languages/cardnames-zh-CN.txt `
            app/manifest-critical.sha256 `
            release.json 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          "=== staged names ===" | Add-Content -LiteralPath $log -Encoding utf8
          & git diff --cached --name-status 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # The large localization table is guarded by an unrelated-row hash above.
          # Run whitespace checking on every other staged text payload.
          "=== scoped diff check ===" | Add-Content -LiteralPath $log -Encoding utf8
          & git diff --cached --check -- `
            app/BUILD-ID.txt `
            app/managed/custom/cards/blue/大法师罗曼斯.txt `
            app/managed/custom/editions/Placeholder_Set.txt `
            app/manifest-critical.sha256 `
            release.json 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-Content -LiteralPath $log -Encoding UTF8 | ForEach-Object { Write-Host $_ }

      - name: Run runtime gates
        id: runtime_gates
        if: ${{ steps.stage_payload.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $reportRoot = Join-Path $env:GITHUB_WORKSPACE 'rommath-final-report'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\tests\test_scripts.ps1' *> (Join-Path $reportRoot 'runtime-test-scripts.log')
          $scriptsExit = $LASTEXITCODE
          Get-Content -LiteralPath (Join-Path $reportRoot 'runtime-test-scripts.log') -Encoding UTF8 | Select-Object -Last 300 | ForEach-Object { Write-Host $_ }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\tests\test_profile_sync.ps1' *> (Join-Path $reportRoot 'runtime-profile-sync.log')
          $profileExit = $LASTEXITCODE
          Get-Content -LiteralPath (Join-Path $reportRoot 'runtime-profile-sync.log') -Encoding UTF8 | Select-Object -Last 300 | ForEach-Object { Write-Host $_ }

          if ($scriptsExit -ne 0 -or $profileExit -ne 0) { exit 1 }

      - name: Upload final publication report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rommath-final-report-${{ github.run_id }}
          path: rommath-final-report
          if-no-files-found: error
          retention-days: 14

      - name: Stop on failed stage or gate
        if: ${{ always() && (steps.stage_payload.outcome != 'success' || steps.runtime_gates.outcome != 'success') }}
        shell: pwsh
        run: |
          throw 'Rommath publication stopped before commit. Inspect the uploaded report.'

      - name: Remove one-shot automation and enforce merge boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            '.github/workflows/temp-rommath-runtime-sync.yml',
            'rommath-runtime-trigger.txt',
            '.github/workflows/rommath-finalize.yml',
            'rommath-final-trigger.txt'
          )) {
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
          }
          git add -u -- `
            .github/workflows/temp-rommath-runtime-sync.yml `
            rommath-runtime-trigger.txt `
            .github/workflows/rommath-finalize.yml `
            rommath-final-trigger.txt

          $allowed = @(
            '.github/workflows/temp-rommath-runtime-sync.yml',
            'rommath-runtime-trigger.txt',
            '.github/workflows/rommath-finalize.yml',
            'rommath-final-trigger.txt',
            'app/BUILD-ID.txt',
            'app/managed/custom/cards/blue/大法师罗曼斯.txt',
            'app/managed/custom/editions/Placeholder_Set.txt',
            'app/managed/custom/cards/pictures/PH01/大法师罗曼斯.artcrop.jpg',
            'app/res/languages/cardnames-zh-CN.txt',
            'app/manifest-critical.sha256',
            'release.json'
          )
          $changed = @(& git diff --cached --name-only)
          $unexpected = @($changed | Where-Object { $allowed -notcontains $_ })
          if ($unexpected.Count -gt 0) { throw "Unexpected staged paths: $($unexpected -join ', ')" }
          foreach ($path in $changed) {
            if ($path -match '卡扎库斯|伪造的药水|Token_HS|CARDS\.md|kazakus') {
              throw "Protected potion path entered the Rommath commit: $path"
            }
          }
          $changed | ForEach-Object { Write-Host "STAGED_PATH=$_" }

      - name: Commit and verify remote main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish Grand Magister Rommath runtime ($env:ROMMATH_BUILD_ID)"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime commit failed.' }
          $commitSha = (& git rev-parse HEAD).Trim()
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Runtime push failed.' }
          $remoteSha = ((& git ls-remote origin refs/heads/main) -split '\s+')[0]
          if ($remoteSha -ne $commitSha) { throw 'Remote main does not match the published commit.' }
          Write-Host "RUNTIME_COMMIT=$commitSha"
