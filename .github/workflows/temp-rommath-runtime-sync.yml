name: Publish Rommath runtime payload

on:
  push:
    branches: [main]
    paths:
      - 'rommath-runtime-trigger.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Checkout Forge DIY source
        uses: actions/checkout@v4
        with:
          repository: GradibelPitt/forge
          ref: diy
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Generate runtime payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE 'source'
          $sourceSha = (& git -C $sourceRoot rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve Forge DIY source commit.' }
          $buildId = '20260904-grand-magister-rommath-' + $sourceSha.Substring(0, 8)
          & .\tools\publish_git_payload.ps1 -ForgeRoot $sourceRoot -BuildId $buildId -SyncCustom
          if ($LASTEXITCODE -ne 0) { throw 'publish_git_payload.ps1 failed.' }
          "ROMMATH_BUILD_ID=$buildId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ROMMATH_SOURCE_SHA=$sourceSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Stage generated payload and run gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git add -- app/BUILD-ID.txt app/managed/custom app/res/languages/cardnames-zh-CN.txt app/manifest-critical.sha256 release.json
          if ($LASTEXITCODE -ne 0) { throw 'Failed to stage runtime payload.' }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Staged runtime diff check failed.' }
          & .\tests\test_scripts.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Runtime script gate failed.' }
          & .\tests\test_profile_sync.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Runtime profile sync gate failed.' }
      - name: Remove one-shot files, commit and push
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath '.github/workflows/temp-rommath-runtime-sync.yml' -Force
          Remove-Item -LiteralPath 'rommath-runtime-trigger.txt' -Force
          git add -u -- .github/workflows/temp-rommath-runtime-sync.yml rommath-runtime-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish Grand Magister Rommath runtime ($env:ROMMATH_BUILD_ID)"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime commit failed.' }
          git push origin main
          if ($LASTEXITCODE -ne 0) { throw 'Runtime push failed.' }
