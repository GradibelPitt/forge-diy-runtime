name: Publish verified forge:diy payload

on:
  push:
    branches: [main]
    paths:
      - 'release-source.txt'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit currently at GradibelPitt/forge:diy
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-diy-runtime
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Check out runtime main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve pinned source commit
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $requested = '${{ github.event.inputs.source_sha }}'.Trim()
          if ([string]::IsNullOrWhiteSpace($requested)) {
            if (-not (Test-Path -LiteralPath 'release-source.txt' -PathType Leaf)) {
              throw 'release-source.txt is missing and no workflow_dispatch source_sha was supplied.'
            }
            $requested = (Get-Content -LiteralPath 'release-source.txt' -Raw).Trim()
          }
          if ($requested -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Invalid source commit: '$requested'. Expected exactly 40 hexadecimal characters."
          }
          $requested = $requested.ToLowerInvariant()
          "sha=$requested" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "short=$($requested.Substring(0, 12))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check out the exact Forge DIY source commit
        uses: actions/checkout@v4
        with:
          repository: GradibelPitt/forge
          ref: ${{ steps.source.outputs.sha }}
          path: forge-source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pin is the current diy head
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE 'forge-source'
          $requested = '${{ steps.source.outputs.sha }}'
          $actual = (& git -C $sourceRoot rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $requested) {
            throw "Checked-out source '$actual' does not match requested '$requested'."
          }
          & git -C $sourceRoot fetch origin diy --no-tags
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch origin/diy for source-head verification.' }
          $remote = (& git -C $sourceRoot rev-parse origin/diy).Trim().ToLowerInvariant()
          if ($remote -ne $requested) {
            throw "Pinned source '$requested' is not the current origin/diy head '$remote'."
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run controlled source contract gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & python -m pip install --disable-pip-version-check pillow
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install Pillow for image-contract tests.' }

          $customRoot = Join-Path $env:GITHUB_WORKSPACE 'forge-source\custom'
          Push-Location $customRoot
          try {
            $cards = @(
              'cards/blue/大法师罗曼斯.txt',
              'cards/colorless/小型卡扎库斯药水.txt',
              'cards/colorless/卡扎库斯药水.txt'
            )
            foreach ($card in $cards) {
              if (-not (Test-Path -LiteralPath $card -PathType Leaf)) {
                throw "Missing required source card: $card"
              }
              & python tools/lint_card.py $card
              if ($LASTEXITCODE -ne 0) { throw "Card lint failed: $card" }
            }

            & python -m unittest tests.test_grand_magister_rommath -v
            if ($LASTEXITCODE -ne 0) { throw 'Grand Magister Rommath contract tests failed.' }

            $kazakusModules = @(
              Get-ChildItem -LiteralPath 'tests' -Filter 'test_*.py' -File |
                Where-Object {
                  (Get-Content -LiteralPath $_.FullName -Raw -Encoding utf8) -match '小型卡扎库斯药水|卡扎库斯药水'
                } |
                ForEach-Object { "tests.$($_.BaseName)" } |
                Sort-Object -Unique
            )
            if ($kazakusModules.Count -lt 3) {
              throw "Expected the two restored potion test modules plus the native-token contract; found $($kazakusModules.Count): $($kazakusModules -join ', ')"
            }
            & python -m unittest @kazakusModules -v
            if ($LASTEXITCODE -ne 0) { throw 'Kazakus potion contract tests failed.' }
          }
          finally {
            Pop-Location
          }

      - name: Generate the complete runtime payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE 'forge-source'
          $sourceSha = '${{ steps.source.outputs.sha }}'
          $buildId = "diy-${{ steps.source.outputs.short }}"
          & .\tools\publish_git_payload.ps1 -ForgeRoot $sourceRoot -BuildId $buildId -SyncCustom
          if ($LASTEXITCODE -ne 0) { throw 'publish_git_payload.ps1 failed.' }
          "PUBLISH_BUILD_ID=$buildId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PUBLISH_SOURCE_SHA=$sourceSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify source and runtime mirror parity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-TreeHashMap([string]$Root) {
            if (-not (Test-Path -LiteralPath $Root -PathType Container)) {
              throw "Required directory is missing: $Root"
            }
            $resolved = (Resolve-Path -LiteralPath $Root).Path
            $map = @{}
            Get-ChildItem -LiteralPath $resolved -Recurse -File | ForEach-Object {
              $relative = $_.FullName.Substring($resolved.Length).TrimStart('\').Replace('\', '/')
              $map[$relative] = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            return $map
          }

          function Assert-SameTree([string]$Source, [string]$Runtime, [string]$Label) {
            $sourceMap = Get-TreeHashMap $Source
            $runtimeMap = Get-TreeHashMap $Runtime
            $keys = @($sourceMap.Keys + $runtimeMap.Keys | Sort-Object -Unique)
            $errors = @()
            foreach ($key in $keys) {
              if (-not $sourceMap.ContainsKey($key)) {
                $errors += "$Label extra runtime file: $key"
              }
              elseif (-not $runtimeMap.ContainsKey($key)) {
                $errors += "$Label missing runtime file: $key"
              }
              elseif ($sourceMap[$key] -ne $runtimeMap[$key]) {
                $errors += "$Label hash mismatch: $key"
              }
            }
            if ($errors.Count -gt 0) {
              throw ($errors -join [Environment]::NewLine)
            }
          }

          $source = Join-Path $env:GITHUB_WORKSPACE 'forge-source'
          Assert-SameTree (Join-Path $source 'custom\cards') 'app\managed\custom\cards' 'cards'
          Assert-SameTree (Join-Path $source 'custom\tokens') 'app\managed\custom\tokens' 'tokens'
          Assert-SameTree (Join-Path $source 'custom\editions') 'app\managed\custom\editions' 'editions'
          Assert-SameTree (Join-Path $source 'custom\music') 'app\managed\custom\music' 'music'

          $sourceLocale = Join-Path $source 'forge-gui\res\languages\cardnames-zh-CN.txt'
          $runtimeLocale = 'app\res\languages\cardnames-zh-CN.txt'
          $sourceLocaleHash = (Get-FileHash -LiteralPath $sourceLocale -Algorithm SHA256).Hash
          $runtimeLocaleHash = (Get-FileHash -LiteralPath $runtimeLocale -Algorithm SHA256).Hash
          if ($sourceLocaleHash -ne $runtimeLocaleHash) {
            throw 'cardnames-zh-CN.txt differs between source and runtime.'
          }

          $release = Get-Content -LiteralPath 'release.json' -Raw -Encoding utf8 | ConvertFrom-Json
          if ($release.sourceCommit -ne $env:PUBLISH_SOURCE_SHA) {
            throw "release.json sourceCommit '$($release.sourceCommit)' does not match '$env:PUBLISH_SOURCE_SHA'."
          }
          if ($release.buildId -ne $env:PUBLISH_BUILD_ID) {
            throw "release.json buildId '$($release.buildId)' does not match '$env:PUBLISH_BUILD_ID'."
          }
          $buildFile = (Get-Content -LiteralPath 'app\BUILD-ID.txt' -Raw -Encoding utf8).Trim()
          if ($buildFile -ne $env:PUBLISH_BUILD_ID) {
            throw "BUILD-ID.txt '$buildFile' does not match '$env:PUBLISH_BUILD_ID'."
          }
          if (-not (Test-Path -LiteralPath 'app\manifest-critical.sha256' -PathType Leaf) -or
              (Get-Item -LiteralPath 'app\manifest-critical.sha256').Length -eq 0) {
            throw 'manifest-critical.sha256 is missing or empty.'
          }
          if (Test-Path -LiteralPath 'app\managed\custom\tokens\c_5_5_demon.txt') {
            throw 'The runtime payload unexpectedly contains c_5_5_demon.txt.'
          }

      - name: Run runtime and profile-sync gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\test_scripts.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Runtime script gate failed.' }
          & .\tests\test_profile_sync.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Runtime profile-sync gate failed.' }

      - name: Commit generated payload to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git add -- app/BUILD-ID.txt app/managed/custom app/res/languages/cardnames-zh-CN.txt app/manifest-critical.sha256 release.json
          if ($LASTEXITCODE -ne 0) { throw 'Failed to stage generated runtime payload.' }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Staged runtime diff check failed.' }
          if ([string]::IsNullOrWhiteSpace((git diff --cached --name-only))) {
            throw 'Publisher produced no staged payload or metadata changes.'
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish forge:diy payload $env:PUBLISH_SOURCE_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime commit failed.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Runtime push failed.' }
